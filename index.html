<style>

:root{
  color-scheme:light;
  --bg:#f5f7fb;--fg:#172033;--mut:#778197;--card:#ffffff;

  padding-bottom:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);
  font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:480px;margin:0 auto;padding:18px 15px 28px}
.top{display:flex;justify-content:space-between;align-items:center;
  gap:12px;margin-bottom:18px}
h1{font-size:22px;letter-spacing:-.6px;margin:0;font-weight:800}
.sub{color:var(--mut);font-size:12px}
.tm{font-variant-numeric:tabular-nums;font-size:22px;font-weight:800;
  color:var(--ac);background:#eaf0ff;border-radius:12px;padding:7px 12px;
  display:inline-block;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;
  padding:17px;margin-bottom:14px;box-shadow:0 5px 18px rgba(28,45,84,.035)}
.tiles{display:flex;gap:7px;justify-content:center;margin:10px 0 16px}
.t{width:46px;height:52px;border-radius:13px;border:1.5px solid var(--bd);
  display:grid;place-items:center;font-size:24px;font-weight:800;
  background:var(--card);transition:transform .15s ease,border-color .15s ease}
.t.ok{background:#e4f7ef;border-color:#a8e5cb;color:#08784d}
.t.no{background:#fff0f0;border-color:#f4c4c6;color:#c33d48}
.t.cur{border:2px solid var(--ac);background:#f0f4ff;color:var(--ac)}
.p{text-align:center;margin:0 0 12px;color:#566176;font-size:14px}
.p b{color:var(--ac);font-weight:800}
.en{display:flex;justify-content:center;gap:5px;min-height:48px;
  flex-wrap:wrap;margin:12px 0}
.en span{min-width:31px;height:44px;border:1.5px solid var(--bd);
  border-radius:9px;display:grid;place-items:center;font-size:22px;
  font-weight:800;background:#fff}
.en span.h{border-color:var(--ac);color:var(--ac);background:#f0f4ff}
.ms{min-height:23px;text-align:center;color:var(--no);font-size:13px}
.kb{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.r{display:flex;gap:5px;justify-content:center}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.k{flex:1;max-width:39px;height:47px;border:1px solid #e4e9f1;
  border-radius:10px;background:var(--key);color:var(--fg);
  font-weight:700;text-transform:uppercase;box-shadow:0 2px 0 #dfe5ee}
.k:active{transform:translateY(1px);box-shadow:none}
.k.wd{max-width:59px;font-size:12px}
.k.en2{background:var(--ac);border-color:var(--ac);color:var(--acf);
  box-shadow:0 2px 0 #2449cf}
.b{display:block;width:100%;padding:13px 15px;border:0;border-radius:13px;
  background:var(--ac);color:var(--acf);font-weight:750;text-align:center;
  text-decoration:none;margin-top:10px;box-shadow:0 4px 10px rgba(49,94,251,.14)}
.b:active{transform:translateY(1px)}
.b.g{background:#edf1f7;color:#344057;box-shadow:none}
.sc{font-size:46px;font-weight:850;text-align:center;line-height:1.1;
  letter-spacing:-1.5px;color:var(--ac);margin:5px 0 8px}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 2px;
  border-bottom:1px solid var(--bd);font-size:13px}
.row:last-child{border:0}
pre{white-space:pre-wrap;background:#f4f6fa;border:1px solid var(--bd);
  border-radius:13px;padding:12px;font:inherit;margin:10px 0 0;
  text-align:center;color:#344057}
ol{padding-left:20px;margin:8px 0 12px}
li{margin:7px 0;color:#566176;font-size:14px}
.card>b{font-size:15px}
.sc2{overflow-x:auto;border:1px solid var(--bd);border-radius:13px;margin-top:11px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:300px}
td,th{padding:11px 9px;text-align:left;border-bottom:1px solid var(--bd)}
th{background:#f4f6fa;color:#788399;font-size:11px;text-transform:uppercase;
  letter-spacing:.45px;font-weight:750}
tbody tr:last-child td{border-bottom:0}
tbody tr:first-child td{background:#f5f8ff;font-weight:750}
td:nth-child(2){color:var(--ac);font-weight:800;font-variant-numeric:tabular-nums}
td:nth-child(3){font-variant-numeric:tabular-nums}
.sound-toggle{border:1px solid var(--bd);background:#fff;color:#526078;
  border-radius:11px;padding:8px 10px;font-size:12px;font-weight:700;
  white-space:nowrap}
.sound-toggle:active{background:#f0f4ff}
.score-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.best-pill{font-size:11px;font-weight:800;color:#946200;background:#fff5d9;
  border-radius:20px;padding:5px 9px}
.score-note{margin-top:9px;color:var(--mut);font-size:12px}
@media(max-width:360px){.w{padding:14px 11px}.k{height:44px}.t{width:41px;height:48px}}


.stk{text-align:center}
.stk-n{font-size:24px;font-weight:850;letter-spacing:-.5px;margin-bottom:2px}
.tabs{display:flex;gap:6px;margin:12px 0 6px}
.tab{flex:1;border:1px solid var(--bd);background:#fff;color:#526078;border-radius:11px;padding:8px 6px;font-size:13px;font-weight:700}
.tab.on{background:var(--ac);border-color:var(--ac);color:var(--acf)}
.lbr{display:flex;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px solid var(--bd);font-size:14px}
.lbr:last-child{border:0}
.lbr .rk{width:28px;text-align:center;font-weight:800;color:var(--mut)}
.lbr .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:650}
.lbr .vl{font-weight:800;color:var(--ac);font-variant-numeric:tabular-nums;text-align:right}
.lbr .sb{display:block;font-size:11px;color:var(--mut);font-weight:600}
.lbr.you{background:#f0f4ff;border-radius:10px}
.lbr.sep{border-top:1px dashed var(--bd)}

function ls(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function ss(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var n0=new Date(),DAY=Math.max(1,Math.floor((Date.UTC(n0.getFullYear(),n0.getMonth(),n0.getDate())-Date.UTC(2026,10,11))/864e5)+1);
var T=POOL[(DAY-1)%POOL.length].toUpperCase(),N=T.length,R=3;
var S=ls("hft_s");if(!S||S.day!==DAY)S={day:DAY,t0:null,end:null,rs:[]};
var H=ls("hft_h")||{},buf="",msg="";
function $(i){return document.getElementById(i)}
function fmt(ms){var s=Math.floor(ms/1000);return Math.floor(s/60)+":"+("0"+s%60).slice(-2)}
function fin(){return S.rs.length>=N*R}
function st(){var ok=0,pts=0;S.rs.forEach(function(r){if(r.w){ok++;pts+=r.p}});var ms=(S.end||Date.now())-S.t0,b=ok?Math.max(0,Math.floor((420-ms/1000)/7)):0;return{ok:ok,pts:pts,b:b,total:pts+b,ms:ms}}
function shareText(){var s=st();return "Harfigatop #"+DAY+"\n"+[0,1,2].map(function(q){return S.rs.slice(q*N,q*N+N).map(function(r){return r.w?"🟩":"🟥"}).join("")}).join("\n")+"\n"+s.ok+"/"+N*R+" · "+s.total+" ball · "+fmt(s.ms)}
function link(){return location.href.split("#")[0]}
function streak(){var d=H[DAY]?DAY:DAY-1,c=0;while(d>0&&H[d]){c++;d--}return c}
function bestScore(obj){var b=0;Object.keys(obj).forEach(function(d){b=Math.max(b,obj[d].s||0)});return b}
var TG=window.Telegram&&Telegram.WebApp;
if(TG){try{TG.ready();TG.expand()}catch(e){}}
var INIT=(TG&&TG.initData)||"";
var LB=null,lbTab="today",lbErr=false;
function esc(x){return String(x).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function api(path,body){
  var o={headers:{}};
  if(INIT)o.headers.Authorization="tma "+INIT;
  if(body){o.method="POST";o.headers["Content-Type"]="application/json";o.body=JSON.stringify(body)}
  return fetch(path,o).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})
}
function loadLB(){return api("/api/leaderboard?day="+DAY).then(function(d){LB=d;lbErr=false;render()}).catch(function(){lbErr=true;render()})}
function sendScore(){
  var e=H[DAY];if(!e||e.sent||!INIT)return Promise.resolve();
  return api("/api/submit",{day:DAY,score:e.s,time_ms:e.t,ok:e.k,n:e.n}).then(function(){e.sent=1;ss("hft_h",H)}).catch(function(){})
}
function sync(){sendScore().then(loadLB)}
function myStreak(){return INIT&&LB&&LB.me?LB.me.streak:streak()}
function streakCard(){
  var n=myStreak(),done=!!H[DAY],best=LB&&LB.me?LB.me.best_streak:0;
  var h='<div class="card stk"><div class="stk-n">🔥 '+n+' kunlik seriya</div><div class="sub">';
  h+=done?'Bugungi oʻyin hisoblandi':n>0?'Bugun oʻynasangiz seriya '+(n+1)+' kunga yetadi':'Bugun oʻynab, yangi seriyani boshlang';
  h+='</div>';
  if(best>0)h+='<div class="best-pill" style="display:inline-block;margin-top:9px">🏆 Eng uzun seriya: '+best+' kun</div>';
  return h+'</div>'
}
function lbRow(i,r){
  var rk=i<3?["🥇","🥈","🥉"][i]:i+1,v,sb="";
  if(lbTab==="today"){v=r.score+' ball';sb=fmt(r.ms)+' · '+r.ok+'/'+r.n}
  else if(lbTab==="streak"){v='🔥 '+r.st;sb='rekord: '+r.best}
  else{v=r.total+' ball';sb=r.games+' oʻyin'}
  return '<div class="lbr'+(r.you?' you':'')+'"><span class="rk">'+rk+'</span><span class="nm">'+esc(r.name)+'</span><span class="vl">'+v+'<span class="sb">'+sb+'</span></span></div>'
}
function lbCard(){
  var tabs=[["today","Bugun"],["streak","Seriya"],["total","Jami"]];
  var h='<div class="card"><b>Umumiy reyting</b><div class="tabs">';
  tabs.forEach(function(t){h+='<button class="tab'+(lbTab===t[0]?' on':'')+'" data-a="tab" data-v="'+t[0]+'">'+t[1]+'</button>'});
  h+='</div>';
  if(!LB){return h+'<div class="score-note">'+(lbErr?'Reyting yuklanmadi. Keyinroq urinib koʻring.':'Yuklanmoqda…')+'</div></div>'}
  var rows=LB[lbTab]||[];
  if(!rows.length)h+='<div class="score-note">Hozircha hech kim yoʻq. Birinchi boʻling!</div>';
  rows.forEach(function(r,i){h+=lbRow(i,r)});
  var me=LB.me;
  if(lbTab==="today"&&me&&me.rank_today>rows.length){h+='<div class="lbr you sep"><span class="rk">'+me.rank_today+'</span><span class="nm">Siz</span><span class="vl">'+me.today+' ball</span></div>'}
  if(!INIT)h+='<div class="score-note">Natijangiz reytingga qoʻshilishi uchun oʻyinni Telegram ichida oching.</div>';
  return h+'</div>'
}
var soundOn=ls("hft_sound")!==false,audioCtx=null;
function tone(freq,duration,type,volume){
  if(!soundOn)return;
  try{
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    if(!audioCtx)audioCtx=new AC();
    if(audioCtx.state==="suspended")audioCtx.resume();
    var o=audioCtx.createOscillator(),g=audioCtx.createGain(),now=audioCtx.currentTime;
    o.type=type||"sine";o.frequency.setValueAtTime(freq,now);
    g.gain.setValueAtTime(volume||0.035,now);
    g.gain.exponentialRampToValueAtTime(0.001,now+duration);
    o.connect(g);g.connect(audioCtx.destination);o.start(now);o.stop(now+duration);
  }catch(e){}
}
function sfx(kind){
  if(kind==="tap")tone(520,.045,"sine",.018);
  if(kind==="start"){tone(440,.08,"sine",.025);setTimeout(function(){tone(660,.1,"sine",.025)},85)}
  if(kind==="good"){tone(660,.09,"sine",.035);setTimeout(function(){tone(880,.14,"sine",.035)},95)}
  if(kind==="skip"){tone(260,.12,"triangle",.025)}
}
function render(){
var h='<div class="top"><div><h1>Harfigatop</h1><div class="sub">Kunlik soʻz #'+DAY+'</div></div><button class="sound-toggle" data-a="sound" id="soundBtn">'+(soundOn?'🔊 Ovoz yoqilgan':'🔇 Ovoz oʻchiq')+'</button></div>';
if(!S.t0){h+='</div>'+streakCard()+'<div class="card"><b>Qoidalar</b><ol><li>Har kuni bitta inglizcha soʻz beriladi.</li><li>3 raund bor. 1-raundda kunlik soʻzning har bir harfi uchun shu harfdan <b>boshlanuvchi</b> soʻz yozasiz. 2-raundda shu harf soʻzda <b>ikkinchi</b>, 3-raundda <b>uchinchi</b> boʻlib kelishi kerak. Masalan, W harfi uchun: word, awake, tower.</li><li>Har soʻz: 10 ball + harflar soni. 7 daqiqadan oldin tugatsangiz, tezlik bonusi bor.</li><li>Taymer «Boshlash» bosilganda ishga tushadi va sahifani yopsangiz ham toʻxtamaydi.</li><li>Kuniga bir marta oʻynaladi.</li></ol><button class="b" data-a="go">Boshlash</button></div>'+lbCard()}
else if(!fin()){var i=S.rs.length,q=Math.floor(i/N),c=i%N;
h+='<div class="tm" id="tm">'+fmt(Date.now()-S.t0)+'</div></div><div class="tiles">';
for(var j=0;j<N;j++)h+='<div class="t '+(j<c?(S.rs[q*N+j].w?"ok":"no"):j===c?"cur":"")+'">'+T[j]+'</div>';
h+='</div><p class="p">'+(q+1)+'-raund · '+(c+1)+'/'+N+': '+(q+1)+'-harfi <b>'+T[c]+'</b> boʻlgan soʻz</p><div class="en">';
for(var k=0;k<Math.max(buf.length,1);k++)h+='<span class="'+(k===q?"h":"")+'">'+(buf[k]||"")+'</span>';
h+='</div><div class="ms">'+msg+'</div><div class="kb">';
["qwertyuiop","asdfghjkl","*zxcvbnm#"].forEach(function(r){h+='<div class="r">';r.split("").forEach(function(c){h+=c==="*"?'<button class="k wd en2" data-k="Enter">OK</button>':c==="#"?'<button class="k wd" data-k="Backspace">⌫</button>':'<button class="k" data-k="'+c+'">'+c+'</button>'});h+='</div>'});
h+='</div><button class="b g" data-a="skip">Oʻtkazib yuborish (0 ball)</button>'}
else{var s=st(),tx=shareText();
h+='</div><div class="tiles">';for(var m=0;m<N;m++){var z=(S.rs[m].w?1:0)+(S.rs[m+N].w?1:0)+(S.rs[m+2*N].w?1:0);h+='<div class="t '+(z===3?"ok":z===0?"no":"cur")+'">'+T[m]+'</div>'}
h+='</div><div class="card"><div class="sc">'+s.total+' ball</div><div class="sub" style="text-align:center">Vaqt: '+fmt(s.ms)+'</div><div class="row"><span>Soʻzlar ('+s.ok+'/'+N*R+')</span><span>'+s.pts+'</span></div><div class="row"><span>Tezlik bonusi</span><span>+'+s.b+'</span></div><div class="row"><span>Seriya</span><span>'+myStreak()+' kun</span></div></div>';
h+='<div class="card"><b>Natijani ulashish</b><pre>'+tx+'</pre><button class="b" data-a="cp" id="cp">Nusxa olish</button><a class="b g" target="_blank" rel="noopener" href="https://t.me/share/url?url='+encodeURIComponent(link())+'&text='+encodeURIComponent(tx)+'">Telegramda ulashish</a></div>';
h+=lbCard();h+='<div class="card"><div class="score-head"><b>Mening natijalarim</b><span class="best-pill">🏆 Eng yaxshi: '+bestScore(H)+' ball</span></div><div class="sc2"><table><thead><tr><th>#</th><th>Kun</th><th>Ball</th><th>Vaqt</th><th>Soʻz</th></tr></thead><tbody>';
var ks=Object.keys(H).map(Number).sort(function(a,b){return b-a}).slice(0,7);
ks.forEach(function(d,idx){var e=H[d];h+='<tr><td>'+(idx===0?'★':idx+1)+'</td><td>#'+d+'</td><td>'+e.s+'</td><td>'+fmt(e.t)+'</td><td>'+e.k+'/'+e.n+'</td></tr>'});
h+='</tbody></table></div><div class="score-note">Oxirgi 7 kunlik natijalaringiz.</div></div><div class="sub" style="text-align:center">Keyingi soʻzgacha: <b id="nx"></b></div>'}
$("app").innerHTML=h}
function say(m){msg=m;render()}
function nxt(){buf="";msg="";if(fin()){S.end=Date.now();var s=st();H[DAY]={s:s.total,t:s.ms,k:s.ok,n:N*R};ss("hft_h",H);sync()}ss("hft_s",S);render()}
function submit(){var i=S.rs.length,p=Math.floor(i/N),c=i%N,w=buf.toLowerCase();
if(w.length<p+1)return say("Soʻz kamida "+(p+1)+" harfdan iborat boʻlsin");
if(w[p]!==T[c].toLowerCase())return say((p+1)+"-harf "+T[c]+" boʻlishi kerak");
if(!WORDS.has(w))return say("Bu soʻz roʻyxatda yoʻq");
if(S.rs.some(function(r){return r.w===w}))return say("Bu soʻzni ishlatgansiz");
S.rs.push({w:w,p:10+w.length});sfx("good");nxt()}
function key(k){if(!S.t0||fin())return;
if(k==="Enter")return submit();
if(k==="Backspace"){buf=buf.slice(0,-1);msg="";return render()}
if(/^[a-z]$/i.test(k)&&buf.length<14){sfx("tap");buf+=k.toUpperCase();msg="";render()}}
document.addEventListener("keydown",function(e){if(e.ctrlKey||e.metaKey||e.altKey)return;if(e.key==="Enter"||e.key==="Backspace"||/^[a-z]$/i.test(e.key)){e.preventDefault();key(e.key)}});
document.addEventListener("click",function(e){var b=e.target.closest("[data-k],[data-a]");if(!b)return;
if(b.dataset.k)return key(b.dataset.k);
var a=b.dataset.a;if(a==="tab"){lbTab=b.dataset.v;render();return}
if(a==="sound"){soundOn=!soundOn;ss("hft_sound",soundOn);if(soundOn)sfx("tap");render();return}
if(a==="go"){sfx("start");S.t0=Date.now();ss("hft_s",S);render()}
if(a==="skip"){sfx("skip");S.rs.push({w:null,p:0});nxt()}
if(a==="cp"){var t=shareText()+"\n"+link();
var ok=function(){b.textContent="Nusxa olindi ✓"};
try{navigator.clipboard.writeText(t).then(ok,fb)}catch(x){fb()}
function fb(){var ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");ok()}catch(x){}document.body.removeChild(ta)}}});
setInterval(function(){var e=$("tm");if(e&&S.t0&&!fin())e.textContent=fmt(Date.now()-S.t0);
var c=$("nx");if(c){var n=new Date(),d=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1)-n,s=Math.floor(d/1000);c.textContent=Math.floor(s/3600)+":"+("0"+Math.floor(s%3600/60)).slice(-2)+":"+("0"+s%60).slice(-2)}},500);
render();sync()})();
</script></body></html>
